[project]
name = "apiforge"
version = "0.1.0"
description = "Automated OWASP API Top 10 vulnerability detection from Postman collections"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Nishanth G E" }]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pyjwt>=2.8.0",
    "openpyxl>=3.1.2",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "black", "ruff", "mypy"]

[project.scripts]
apiforge = "apiforge.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apiforge*"]
